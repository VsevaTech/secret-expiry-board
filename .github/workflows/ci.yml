name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secret-expiry-board:ci .
      - name: Smoke test container
        run: |
          docker run -d --name seb -p 8000:8000 -e SCHEDULER_ENABLED=false secret-expiry-board:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health
          curl -fs -X POST http://127.0.0.1:8000/api/credentials \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI smoke","provider":"ci","owner":"ci","expiry_date":"2099-01-01"}'
          curl -fs -X POST http://127.0.0.1:8000/api/actions/run-expiry-check
          docker logs seb
          docker rm -f seb
